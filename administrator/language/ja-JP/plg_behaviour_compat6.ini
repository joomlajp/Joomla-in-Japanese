PLG_BEHAVIOUR_COMPAT6="Behaviour - J6 下位互換性"
PLG_COMPAT6_FIELD_CLASSES_ALIASES_DESCRIPTION="名前が変更されたり、ネームスペースに移動されたクラスのエイリアスを追加します。"
