PLG_COMPAT6_FIELD_REMOVED_ASSETS_LABEL="削除されたアセット"
PLG_COMPAT6_XML_DESCRIPTION="現在のJoomlaコーディング標準を使用していないエクステンションを使用している場合、このプラグインを有効にすると、以前のメジャーバージョンであるJoomla 5への下位互換性が提供されます。"
