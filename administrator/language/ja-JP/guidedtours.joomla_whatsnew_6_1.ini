COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.1へようこそ！</h1><p>Joomla 6.1 では、サイト構築をより簡単に、安全に、柔軟にする重要な改善が加わりました。このツアーで要点をひと目で確認できます。</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Proof-of-Work CAPTCHA でスパム対策が復活</h2><p>アカウントや API は不要で、プライバシーとアクセシビリティにも配慮した CAPTCHA です。訪問者からは見えないところで、計算問題をバックグラウンドで自動的に解きます。</p><p>有効にするには、<em>エクステンション</em> -&gt; <em>プラグイン</em> で <strong>captcha</strong> を検索して有効にし、グローバル設定でデフォルトに設定します。</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"CAPTCHA の検証中と検証済みの状態\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"基本ワークフローの図\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">ビジュアルワークフローエディターでコンテンツの流れをひと目で把握</h2><p>新しいインタラクティブなワークフロー図で公開までの流れ全体を確認でき、コンテンツのワークフローをより簡単に管理できます。</p><p><em>記事マネージャー</em> -&gt; <em>ワークフロー</em> でワークフローを有効にし、グラフボタンを探してください。</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">メディアのカスタムフィールドに3つの新しいオプション：音声・動画・ドキュメント</h2><p>コンテンツ用のカスタムフィールドを作成するとき、画像だけでなく、あらゆる種類のメディアをコンテンツ作成者が追加できるようになりました。</p><p>メディアは HTML5 の &lt;audio&gt;、&lt;video&gt;、またはドキュメントへのリンク（PDF、スプレッドシートなど）として表示されます。</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"音声・動画・ドキュメントの3つのメディアフィールドオプション\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">バージョン管理と多言語の関連付けに対応した、より賢いモジュール</h2><p>Joomla では以前から記事のバージョン履歴を利用できましたが、同じ機能がモジュールにも広がりました。<br>多言語サイトを運営している場合は、記事と同じように、異なる言語間でモジュールを関連付けられるようになりました。</p><h2>その他の注目すべき改善</h2><ul class=\"mb-3\"><li>TinyMCE リッチテキストエディターで略語 <strong>&lt;abbr&gt;</strong> に対応し、意味的に正しいマークアップでアクセシビリティも向上しました（コンテンツの編集時に、TinyMCE ツールバーの新しい「略語」ボタンを探してください）。</li><li>言語オーバーライドの状態表示と、不足しているオーバーライドをすばやく作成できる UX の改善（状態インジケーター、オーバーライドの簡単な編集）。</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Joomla 6.1の新機能"
