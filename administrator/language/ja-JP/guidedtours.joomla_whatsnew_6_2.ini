COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.2へようこそ！</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">コアのアップデート</h2><div class=\"col-12 mb-3\"><h3>コンテンツ編集の改善</h3><ul><li><strong>メディアマネージャーと「続きを読む」の統合</strong>：画像やメディアの追加が簡単になりました。更新されたピッカーから Joomla のメディアマネージャーが開くようになり、新しい「続きを読む」ボタンで記事の区切りをすばやく挿入できます。</li><li><strong>画像と figure のクラスを分離</strong>：記事のイントロ画像と記事全体の画像で、画像とそれを囲む figure 要素に、それぞれ別の CSS クラスを指定できるようになりました。</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"サブレベルメニュー\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>フロントエンドテンプレート（Cassiopeia）</h3><ul><li><strong>多階層のドロップダウンメニュー</strong>：Cassiopeia のメニューが、ドロップダウンと折りたたみのレイアウトで2階層以上のサブレベルに対応しました。</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>モジュールとサイト設定</h3><ul class=\"mb-3\"><li><strong>mod_login のリンク表示の切り替え</strong>：新しいオプションで、テンプレートオーバーライドを使わずに「パスワードを忘れましたか？」と「ユーザー名を忘れましたか？」のリンクを非表示にできます。初期値は「表示」なので、既存のサイトには影響しません。</li><li><strong>エクステンション更新のセキュリティフラグ</strong>：開発者はリリースをセキュリティアップデートとして指定できます（深刻度は「なし」から「緊急」まで）。指定されたアップデートは、「システム -&gt; アップデート -&gt; エクステンション」とダッシュボードのクイックアイコンで強調表示されます。</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"エクステンションのセキュリティタグ\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Joomla 6.2の新機能"
