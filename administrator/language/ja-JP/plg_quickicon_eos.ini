PLG_QUICKICON_EOS="クイックアイコン - Joomla 6のサポート終了通知"
PLG_QUICKICON_EOS_MESSAGE_ERROR_SUPPORT_ENDED="<p>Joomla 6のサポートは終了しました。できるだけ早く<a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 7にアップグレード</a>してください。</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_01="<p>Joomla 7が到着しました！Joomla 7のすべてをご覧ください。<a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 7の機能</a>や改善内容は、ランディングページを確認してください。</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_02="<p>あなたのサイトが必要とするエクステンションに互換性があれば、それがJoomla 7にアップグレードするタイミングです。<a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">更新前チェッカーの使い方</a>を確認してください。</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SECURITY_ONLY="<p>Joomla 6はセキュリティ専用モードに入りました。サポートは %1$sで終了します。今すぐJoomla 7への<a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">アップグレード計画</a>を開始しましょう。</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SUPPORT_ENDING="<p>Joomla 6のサポートは %1$sで終了します。できるだけ早く<a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla 7へのアップグレード</a>をしてください。</p>"
PLG_QUICKICON_EOS_SNOOZE_BUTTON="すべてのユーザーに対してこのメッセージをスヌーズする"
PLG_QUICKICON_EOS_XML_DESCRIPTION="Joomla 6のサポート終了ステータスをチェックし、コントロールパネルページにアクセスしたときに通知します。"
