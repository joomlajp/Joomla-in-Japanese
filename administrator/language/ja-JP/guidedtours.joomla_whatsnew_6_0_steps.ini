COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">さらなるアップデート</h2><p>注目記事が記事マネージャービューと共有されるようになりました。</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>見逃していませんか？</h3><p>Joomla! 6 はThe Update Framework (TUF) による自動アップデートに対応し、セキュリティとパフォーマンスが向上しました。<br>自動アップデートの設定は<em>Joomla! アップデート</em>の設定セクションにあります。</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>その他の改善と修正</h3><ul class=\"mb-3\"><li>管理者による登録承認時の通知メール送信 <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>TinyMCE の画像ダイアログ内クラスドロップダウンにカスタムクラスを追加 <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>タグの一括削除機能を追加 <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>その他、多数の内部的な改善が行われています...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="その他の機能"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>Joomla 6.0 リリース情報</h3><p><a title=\"リリース情報\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">6.joomla.orgでリリース情報を見る</a></p><hr><h3>ヘルプと情報</h3><p>Joomlaを活用するための多くのリソースや、追加の資料、ドキュメント、サポート、Joomla への参加方法などへのリンクがここにまとめられています。</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="詳細情報とヘルプ"
