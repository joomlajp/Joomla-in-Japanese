PLG_SYSTEM_JOOA11Y="システム - Joomla アクセシビリティチェッカー"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="チェック対象エリア"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="セレクターを1つ入力するだけで、ウェブサイトの特定のエリアをターゲットにすることができます。デフォルト設定はランドマーク<strong>main</strong>です。ランドマークに代わるものは、クラス、エレメント、ARIAロールです。（例：#main-content, .main, [role='main']）ページ全体をチェックするには<strong>body</strong>と入力してください。"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="Turn Off Checks"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="キー名を指定して特定のチェックをオフにします。詳しい方法は<a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">チェックをオフにする</a>をご覧ください。"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="リージョンを無視する"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="コンテンツコンテナ内の特定領域を無視します。クラスや要素の区切りにはカンマを使用します。(例: #ignore, .ignore)"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="その他のプロパティ"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="追加プロパティを渡してカスタマイズします。詳しい方法は<a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">追加プロパティ</a>を参照ください。"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="可読性ターゲットエリア"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="可読性をチェックするページ上の目印です。デフォルト設定はランドマーク<strong>main</strong>です。"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="常に表示"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="全ページにアクセシビリティチェッカーを搭載します。これはウェブサイトを開発するときに便利ですが、ウェブサイトを公開するときにオンにしたままにしてはいけません。"
PLG_SYSTEM_JOOA11Y_KEY="キー"
PLG_SYSTEM_JOOA11Y_VALUE="値"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Joomla アクセシビリティチェッカーはアクセシビリティとユーザビリティに関する一般的な問題を視覚的に強調します。コンテンツ作成者向けに、エラーや警告を特定し、その修正方法を案内するプラグインです。このプラグインは、ウェブサイトの徹底的な分析を提供するものではなく、ウェブサイトのアクセシビリティを自動的に保証するものでもないことにご注意ください。あなたのサイトがアクセシビリティ基準を満たしていることを確認するためには、本質的にアクセシブルなテンプレートを選択することが重要です。"
