COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Joomla 6.2 リリース情報</h3><p><a title=\"リリース情報\" href=\"https://www.joomla.org/announcements/release-news/joomla-6-2-is-here.html\" target=\"_blank\" rel=\"noopener noreferrer\">joomla.orgでリリース情報を見る</a></p><hr><h3>ヘルプと情報</h3><p class=\"mb-3\">Joomlaを活用するための多くのリソースや、追加の資料、ドキュメント、サポート、Joomla への参加方法などへのリンクがここにまとめられています。</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"新しいヘルプの目次\" width=\"450\" height=\"275\"></p>"
