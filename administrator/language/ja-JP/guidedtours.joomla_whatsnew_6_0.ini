COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6!へようこそ！</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-6 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"子テンプレートのスタイルカスタマイザーを表示\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-6 mb-3\"><h2 class=\"mb-3\">Cassiopeiaの拡張</h2><p>フォントや色の変更など、高度なカスタマイズ機能を示す新しいスタイルの子テンプレートを体験してください。</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">バージョン管理の拡張</h2><p>Joomla のバージョン管理システムが強化され、カスタムフィールド・タグ・カテゴリーも含まれるようになりました。これにより、すべてのコンテンツ変更を追跡・比較・復元できます。</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="Joomla 6!の新機能"
